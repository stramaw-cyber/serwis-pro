name: Serwisant PRO buildings v10.18

on:
  push:
    paths:
      - '.github/workflows/buildings-v1018.yml'

permissions:
  contents: write

jobs:
  patch-buildings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply buildings v10.18 patch
        run: python3 scripts/buildings_v1018_patch.py
      - name: Commit patched buildings module
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/buildings.js partials/pages/buildingsPage.html
          git commit -m "v10.18: expand buildings and projects"
          git push

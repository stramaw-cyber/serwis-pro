name: Serwisant PRO edit-delete v10.10

on:
  push:
    paths:
      - '.github/workflows/company-migration.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch edit delete and trash
        run: python3 scripts/edit_delete_patch.py

      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/app.js
          git commit -m "v10.10: add edit delete and expanded trash"
          git push

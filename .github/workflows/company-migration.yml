name: Serwisant PRO permissions v10.6

on:
  push:
    paths:
      - '.github/workflows/company-migration.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch permissions
        run: python3 scripts/company_migration_patch.py

      - name: Commit patched app and rules
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/app.js firestore.rules
          git commit -m "v10.6: enforce permissions for core modules"
          git push

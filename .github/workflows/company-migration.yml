name: Serwisant PRO photo storage v10.11

on:
  push:
    paths:
      - '.github/workflows/company-migration.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch photo storage
        run: python3 scripts/photo_storage_patch.py

      - name: Commit patched app and Storage rules
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/app.js storage.rules
          git commit -m "v10.11: store service photos in Firebase Storage"
          git push

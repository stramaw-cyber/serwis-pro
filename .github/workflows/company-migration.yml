name: Serwisant PRO companyId migration patch

on:
  push:
    paths:
      - '.github/workflows/company-migration.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.js diagnostics
        run: python3 scripts/company_migration_patch.py

      - name: Commit patched app.js
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/app.js
          git commit -m "v10.5.1: show exact Firestore collection error"
          git push

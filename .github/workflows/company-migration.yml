name: Serwisant PRO vehicles v10.8

on:
  push:
    paths:
      - '.github/workflows/company-migration.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch vehicles and fuel
        run: python3 scripts/vehicles_fuel_patch.py

      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/core/app.js js/core/pages.json partials/pages/dashboard.html partials/pages/vehiclesPage.html partials/pages/fuelPage.html js/modules/vehicles.js js/modules/fuel.js
          git commit -m "v10.8: add vehicles and fuel modules"
          git push

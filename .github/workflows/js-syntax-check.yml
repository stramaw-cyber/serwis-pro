name: JS syntax check

on:
  push:
    paths:
      - 'js/core/app.js'
      - 'js/modules/vehicles.js'
      - 'js/modules/fuel.js'
      - 'js/modules/buildings.js'
      - '.github/workflows/js-syntax-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app.js
        run: node --check js/core/app.js
      - name: Check vehicles.js
        run: node --check js/modules/vehicles.js
      - name: Check fuel.js
        run: node --check js/modules/fuel.js
      - name: Check buildings.js
        run: node --check js/modules/buildings.js

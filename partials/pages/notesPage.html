<section class="page" id="notesPage">
<div class="pageHomeBar"><div class="sectionPageTitle"><strong>Notatnik</strong></div><button class="homeBack" onclick="go('dashboard')">← Strona główna</button></div>
<div class="card"><div class="row"><input id="notesSearch" placeholder="Szukaj w notatkach..." oninput="renderNotesModule()"><select id="notesCategoryFilter" onchange="renderNotesModule()"><option value="">Wszystkie kategorie</option><option>Serwis</option><option>Kody / hasła</option><option>Klient</option><option>Budowa</option><option>Zakupy</option><option>Do zrobienia</option><option>Inne</option></select><button id="addNoteBtn" onclick="openNoteForm()">+ Nowa notatka</button></div></div>
<div class="grid homeKpis" id="notesKpis"></div><div id="notesList"></div>
<div class="card hidden" id="noteEditor"><div class="pageHeader"><h2 id="noteFormTitle">Nowa notatka</h2><button class="secondary" onclick="closeNoteForm()">Zamknij</button></div><input id="noteId" type="hidden"><div class="grid"><div><label>Tytuł</label><input id="noteTitle" placeholder="np. Ferroli Omnia — kod serwisowy"></div><div><label>Kategoria</label><select id="noteCategory"><option>Serwis</option><option>Kody / hasła</option><option>Klient</option><option>Budowa</option><option>Zakupy</option><option>Do zrobienia</option><option>Inne</option></select></div></div><label>Treść</label><textarea id="noteBody" rows="8" placeholder="Wpisz notatkę..."></textarea><label style="display:flex;gap:8px;align-items:center"><input id="notePinned" type="checkbox" style="width:auto"> Przypnij jako ważną</label><div class="toolbar"><button onclick="saveNoteRecord()">Zapisz</button></div></div>
</section>

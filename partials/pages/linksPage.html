<section class="page" id="linksPage">
<div class="pageHomeBar"><div class="sectionPageTitle"><strong>Szybkie linki</strong></div><button class="homeBack" onclick="go('dashboard')">← Strona główna</button></div>
<div class="card"><div class="row"><input id="linksSearch" placeholder="Szukaj linku, producenta, instrukcji..." oninput="renderLinksModule()"><select id="linksCategoryFilter" onchange="renderLinksModule()"><option value="">Wszystkie kategorie</option><option>Producent</option><option>Instrukcja / DTR</option><option>Sklep / hurtownia</option><option>Narzędzia online</option><option>Urzędy / formalności</option><option>Inne</option></select><button id="addLinkBtn" onclick="openLinkForm()">+ Dodaj link</button></div></div>
<div class="grid homeKpis" id="linksKpis"></div><div id="linksList"></div>
<div class="card hidden" id="linkEditor"><div class="pageHeader"><h2 id="linkFormTitle">Nowy link</h2><button class="secondary" onclick="closeLinkForm()">Zamknij</button></div><input id="linkId" type="hidden"><div class="grid"><div><label>Nazwa</label><input id="linkName" placeholder="np. Ferroli — dokumentacja"></div><div><label>Kategoria</label><select id="linkCategory"><option>Producent</option><option>Instrukcja / DTR</option><option>Sklep / hurtownia</option><option>Narzędzia online</option><option>Urzędy / formalności</option><option>Inne</option></select></div></div><label>Adres URL</label><input id="linkUrl" placeholder="https://..."><label>Opis / uwagi</label><textarea id="linkNotes" rows="4"></textarea><label style="display:flex;gap:8px;align-items:center"><input id="linkPinned" type="checkbox" style="width:auto"> Przypnij jako ważny</label><div class="toolbar"><button onclick="saveLinkRecord()">Zapisz</button></div></div>
</section>

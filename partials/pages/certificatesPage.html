<section class="page" id="certificatesPage"><div class="pageHomeBar"><div class="sectionPageTitle"><strong>Certyfikaty i uprawnienia</strong></div><button class="homeBack" onclick="go('dashboard')">← Strona główna</button></div><div class="card"><div class="row"><select id="certEmployeeFilter" onchange="renderCertificatesModule()"><option value="">Wszyscy pracownicy</option></select><select id="certStatusFilter" onchange="renderCertificatesModule()"><option value="">Wszystkie</option><option value="expired">Po terminie</option><option value="soon">Do 30 dni</option><option value="valid">Ważne</option></select><button id="addCertBtn" onclick="openCertificateForm()">+ Dodaj uprawnienie</button></div></div><div id="certKpis" class="grid"></div><div id="certAlerts"></div><div id="certList"></div><div id="certEditor" class="card hidden"><div class="pageHeader"><h2 id="certFormTitle">Nowe uprawnienie</h2><button class="secondary" onclick="closeCertificateForm()">Zamknij</button></div><input id="certId" type="hidden"><div class="grid"><div><label>Pracownik</label><select id="certEmployee"></select></div><div><label>Rodzaj</label><select id="certType"><option>G1 elektryczne</option><option>G2 cieplne</option><option>G3 gazowe</option><option>F-gazy</option><option>Lutowanie twarde</option><option>UDT</option><option>Prawo jazdy</option><option>Inne</option></select></div><div><label>Numer / zakres</label><input id="certNumber" placeholder="numer dokumentu lub zakres"></div><div><label>Wydano</label><input id="certDate" type="date"></div><div><label>Ważne do</label><input id="certValidTo" type="date"></div></div><label>Uwagi</label><textarea id="certNotes" rows="3"></textarea><label>Skan / zdjęcie dokumentu</label><input id="certFile" type="file" accept="image/*,.pdf,.doc,.docx"><div class="toolbar"><button onclick="saveCertificateRecord()">Zapisz</button></div></div></section>
